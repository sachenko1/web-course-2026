<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задачи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="no-copy">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="todo-app">
    <header class="app-header">
      <h1 class="app-title">Мои задачи</h1>
      <p class="app-subtitle">Организуйте рабочий процесс эффективно и без суеты</p>
    </header>

    <section class="todo-input-section">
      <form id="todo-form" class="todo-form" novalidate>
        <div class="input-wrapper">
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </div>
          <input 
            type="text" 
            id="todo-input" 
            placeholder="Что запланировано на сегодня?" 
            autocomplete="off"
            aria-label="Новая задача"
          >
          <button type="submit" id="add-btn" class="btn btn-primary" title="Добавить задачу">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Добавить</span>
          </button>
        </div>
        <div id="validation-msg" class="validation-msg" role="alert" aria-live="polite">
          <svg class="warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>Пожалуйста, введите текст задачи</span>
        </div>
      </form>
    </section>

    <section class="todo-controls">
      <nav class="filter-group" id="filter-group" aria-label="Фильтры">
        <div class="filter-glider" id="filter-glider"></div>
        <button type="button" class="filter-btn active" data-filter="all">Все</button>
        <button type="button" class="filter-btn" data-filter="active">Активные</button>
        <button type="button" class="filter-btn" data-filter="completed">Завершённые</button>
      </nav>

      <div class="todo-counter" aria-live="polite">
        <span class="counter-item">Осталось: <strong id="count-remaining">0</strong></span>
        <span class="counter-separator"></span>
        <span class="counter-item">Выполнено: <strong id="count-completed">0</strong></span>
      </div>
    </section>

    <section class="todo-list-container">
      <ul id="todo-list" class="todo-list" aria-label="Список задач"></ul>
      
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-graphic-wrapper">
          <svg class="empty-vector" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="12" y="10" width="40" height="46" rx="4" stroke-opacity="0.8" />
            <line x1="20" y1="22" x2="44" y2="22" stroke-opacity="0.5" />
            <line x1="20" y1="30" x2="36" y2="30" stroke-opacity="0.5" />
            <circle cx="22" cy="40" r="2.5" fill="currentColor" fill-opacity="0.4" />
            <line x1="28" y1="40" x2="42" y2="40" stroke-opacity="0.5" />
          </svg>
        </div>
        <p class="empty-text">Список пока пуст</p>
        <span class="empty-subtext">Добавьте новую цель или задачу с помощью формы выше</span>
      </div>
    </section>
  </main>
</body>
</html>
