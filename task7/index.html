<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лента постов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="no-copy">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="feed-app">
    <header class="app-header-sticky">
      <h1 class="app-title">Лента постов</h1>
      <div class="search-wrapper">
        <div class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Поиск по заголовку публикации..." 
          autocomplete="off"
        >
      </div>
    </header>

    <div id="error-banner" class="error-banner hidden" role="alert">
      <div class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <span id="error-text">Не удалось загрузить публикации</span>
    </div>

    <section class="posts-section">
      <div id="posts-container" class="posts-container"></div>

      <div id="loading-indicator" class="loading-state hidden">
        <div class="spinner"></div>
        <span>Загрузка...</span>
      </div>

      <div id="end-message" class="info-message hidden">
        Больше постов нет
      </div>

      <div id="empty-search-message" class="info-message hidden">
        По вашему запросу ничего не найдено
      </div>
    </section>
  </main>
</body>
</html>
