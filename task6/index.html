<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка на Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="no-copy">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="game-app">
    <header class="app-header">
      <h1 class="app-title">Змейка</h1>
      <div class="stats-panel">
        <div class="stat-item">
          <span class="stat-label">Счёт</span>
          <strong id="score-val" class="stat-value">0</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">Уровень</span>
          <strong id="level-val" class="stat-value">1</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">Время</span>
          <strong id="time-val" class="stat-value">00:00</strong>
        </div>
      </div>
    </header>

    <section class="canvas-container">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="game-canvas" width="500" height="500"></canvas>

        <div id="game-overlay" class="game-overlay">
          <div class="overlay-card" id="overlay-card">
            <div id="overlay-icon" class="overlay-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </div>
            <h2 id="overlay-title" class="overlay-title">Змейка</h2>
            <p id="overlay-sub" class="overlay-sub">Используйте стрелки или клавиши WASD для управления</p>
            <button type="button" id="play-btn" class="btn btn-primary">
              <span id="play-btn-text">Начать игру</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
